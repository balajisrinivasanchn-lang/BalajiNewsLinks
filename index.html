<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Live News & Shorts Portal</title>
    <style>
        :root {
            --primary: #007bff;
            --dark: #1e1e24;
            --light: #f8f9fa;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
        }
        header {
            background-color: var(--dark);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #ddd;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .card-content {
            padding: 15px;
            text-align: center;
        }
        .card-title {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            font-weight: bold;
        }
        .btn-link {
            display: inline-block;
            padding: 8px 12px;
            background: #ff0000;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .admin-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .submit-btn {
            background: green;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>India Live News & Shorts Portal</h1>
</header>

<div class="container">
    <!-- Language Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchLanguage('english')">English News</button>
        <button class="tab-btn" onclick="switchLanguage('tamil')">Tamil News</button>
        <button class="tab-btn" onclick="scrollToAdmin()">🔧 Admin Dashboard</button>
    </div>

    <!-- Live Channels Grid -->
    <div id="news-grid" class="grid"></div>

    <!-- Admin Page Form -->
    <div id="admin-panel" class="admin-section">
        <h2>🔧 Add More News Channels / Shorts</h2>
        <p style="font-size: 0.9rem; color: #555;">Note: Since this runs client-side, channels added here will save locally to your device's browser layout. To permanently add them for all users globally, hardcode them into the script block inside the `index.html` file.</p>
        <form id="channelForm" onsubmit="addChannel(event)">
            <div class="form-group">
                <label for="channelName">Channel Name</label>
                <input type="text" id="channelName" required placeholder="e.g., NDTV, Thanthi TV">
            </div>
            <div class="form-group">
                <label for="language">Language</label>
                <select id="language">
                    <option value="english">English</option>
                    <option value="tamil">Tamil</option>
                </select>
            </div>
            <div class="form-group">
                <label for="embedUrl">YouTube Live Embed URL / ID</label>
                <input type="text" id="embedUrl" required placeholder="e.g., https://youtube.com or just the Video ID">
            </div>
            <div class="form-group">
                <label for="shortsUrl">Channel Shorts Page URL</label>
                <input type="url" id="shortsUrl" required placeholder="e.g., https://youtube.com">
            </div>
            <button type="submit" class="submit-btn">Add Channel Layout</button>
        </form>
    </div>
</div>

<script>
 // Initial Pre-configured Indian News Channels (Default Seed Data)
    const defaultChannels = [
        {
            name: "NDTV 24x7",
            lang: "english",
            embedId: "_6vCsgS2gQ0", 
            shorts: "https://youtube.com"
        },
        {
            name: "Republic World",
            lang: "english",
            embedId: "6M_O8Kk1Nsc", 
            shorts: "https://youtube.com"
        },
        {
            name: "Polimer News",
            lang: "tamil",
            embedId: "jWvH_cR-pW0", 
            shorts: "https://youtube.com"
        },
        {
            name: "Thanthi TV",
            lang: "tamil",
            embedId: "U3S9g76b5b0", 
            shorts: "https://youtube.com"
        }
    ];

    let currentLanguage = 'english';

    function getChannels() {
        const local = localStorage.getItem('custom_news_channels');
        return local ? JSON.parse(local) : defaultChannels;
    }

    function renderGrid() {
        const grid = document.getElementById('news-grid');
        grid.innerHTML = '';
        const channels = getChannels();

        const filtered = channels.filter(c => c.lang === currentLanguage);

        filtered.forEach(c => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Safe URL construction without string literal errors
            const embedUrl = "https://youtube.com" + c.embedId;
            
            card.innerHTML = 
                '<div class="video-container">' +
                    '<iframe src="' + embedUrl + '" allowfullscreen></iframe>' +
                '</div>' +
                '<div class="card-content">' +
                    '<h3 class="card-title">' + c.name + '</h3>' +
                    '<a href="' + c.shorts + '" target="_blank" class="btn-link">📺 View Shorts</a>' +
                '</div>';
            
            grid.appendChild(card);
        });
    }

    function switchLanguage(lang) {
        currentLanguage = lang;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }
        renderGrid();
    }

    function addChannel(e) {
        e.preventDefault();
        const name = document.getElementById('channelName').value;
        const lang = document.getElementById('language').value;
        const embedId = document.getElementById('embedUrl').value;
        const shorts = document.getElementById('shortsUrl').value;

        const newChannel = { name, lang, embedId, shorts };
        const allChannels = getChannels();
        allChannels.push(newChannel);

        localStorage.setItem('custom_news_channels', JSON.stringify(allChannels));
        document.getElementById('channelForm').reset();
        renderGrid();
        alert('Channel added successfully!');
    }

    function scrollToAdmin() {
        document.getElementById('admin-panel').scrollIntoView({ behavior: 'smooth' });
    }

    // Initial setup invocation
    renderGrid();
</script>

</body>
</html>
